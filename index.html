<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173B63">
<meta name="description" content="BoardEasy — boarding house discovery and management demo for students, landlords and parents. All data is fictional.">
<meta name="mobile-web-app-capable" content="yes">
<title>BoardEasy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23173B63'/%3E%3Cpath d='M10 19.5 20 11l10 8.5V29a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 10 29z' fill='%23fff'/%3E%3Cpath d='m15.5 22 3.3 3.3 6.2-6.6' stroke='%2335B6A3' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Optional web font. The app falls back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root{
  --navy:#173B63; --navy-2:#102d4d; --navy-3:#0c2340;
  --blue:#4EA5D9; --teal:#35B6A3; --bg:#F5F7FA; --white:#FFFFFF;
  --ok:#279B68; --warn:#E8A13A; --bad:#D9534F;
  --text:#263445; --muted:#66758A; --muted-brand:#8492A6; --line:#E2E8F0; --line-2:#EEF2F6;
  --soft:#EDF2F8; --blue-soft:#E6F3FB; --teal-soft:#E3F5F2; --ok-soft:#E4F4EB; --warn-soft:#FCF2E1; --bad-soft:#FBEAEA;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(23,59,99,.05),0 6px 18px rgba(23,59,99,.06);
  --shadow-lg:0 20px 50px rgba(12,35,64,.22);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --font:"Plus Jakarta Sans",Inter,Poppins,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img,svg{max-width:100%}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;color:var(--text);letter-spacing:-.01em}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:750}
h3{font-size:16px;font-weight:700}
h4{font-size:14px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.strong{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid rgba(78,165,217,.55);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ic{flex:none;vertical-align:middle}

/* =========================================================
   2. APP SHELL
   ========================================================= */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:10px;min-height:56px}
.topbar .title{flex:1;min-width:0;font-weight:750;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand-mini{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--navy);cursor:pointer}
.icon-btn:hover{background:var(--soft)}
.icon-btn:active{transform:scale(.96)}
.dot-badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.role-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--navy);border:0;cursor:pointer;max-width:46vw}
.role-chip .av{width:28px;height:28px;font-size:11px}
.role-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-strip{display:flex;align-items:center;gap:8px;background:var(--navy-3);color:#bcd3ea;font-size:12px;padding:6px 16px;line-height:1.35}
.demo-strip b{color:#fff;font-weight:700}
.demo-strip .ic{color:var(--teal)}
.content{width:100%;max-width:1320px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 28px + var(--safe-b))}
.content.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom navigation (phones) */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--safe-b);box-shadow:0 -6px 20px rgba(23,59,99,.06)}
.bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;position:relative}
.bottomnav .on{color:var(--navy)}
.bottomnav .on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.bottomnav .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .15s}
.bottomnav .on .pill{background:var(--blue-soft)}

/* sidebar (tablet rail, laptop/desktop) */
.sidebar{display:none}
.side-inner{display:flex;flex-direction:column;height:100%;padding:18px 12px;gap:4px;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side-brand .word{font-weight:800;font-size:19px;color:#fff;letter-spacing:-.02em}
.side-brand .tag{font-size:11.5px;color:#9db7d3;line-height:1.2}
.side-sec{font-size:11.5px;font-weight:600;color:#7f9cbd;padding:14px 12px 6px}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#d5e3f1;text-decoration:none;font-weight:600;font-size:14px;position:relative;border:0;background:none;cursor:pointer;width:100%;text-align:left}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff}
.side-link.on{background:rgba(78,165,217,.18);color:#fff}
.side-link.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--teal)}
.side-link .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.side-user{display:flex;gap:10px;align-items:center;padding:10px 8px;color:#fff}
.side-user .meta{min-width:0}
.side-user .meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapse-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#9db7d3;background:none;border:0;cursor:pointer;width:100%;font-weight:600;font-size:13px}
.collapse-btn:hover{color:#fff;background:rgba(255,255,255,.07)}

@media (min-width:768px){
  .sidebar{display:block;position:sticky;top:0;height:100vh;height:100dvh;flex:none;width:84px;background:var(--navy);transition:width .2s ease}
  .bottomnav{display:none}
  .content{padding:24px 24px 48px}
  .shell:not(.wide) .side-brand .txt,.shell:not(.wide) .side-link .lbl,.shell:not(.wide) .side-sec,.shell:not(.wide) .side-user .meta,.shell:not(.wide) .collapse-btn .lbl{display:none}
  .shell:not(.wide) .side-link,.shell:not(.wide) .collapse-btn{justify-content:center;padding:12px}
  .shell:not(.wide) .side-link .count{position:absolute;top:4px;right:6px;margin:0}
  .shell:not(.wide) .side-brand{justify-content:center;padding-left:0;padding-right:0}
  .shell:not(.wide) .side-user{justify-content:center}
  .shell.wide .sidebar{width:260px}
  .topbar .brand-mini{display:none}
}
@media (min-width:1024px){
  .content{padding:28px 36px 56px}
  .topbar{padding:10px 36px}
}

/* =========================================================
   3. LAYOUT HELPERS
   ========================================================= */
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.spacer{flex:1}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g2s{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.grid.g2,.grid.g3,.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1280px){.grid.props{grid-template-columns:repeat(3,minmax(0,1fr))}}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.split{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}.split.even{grid-template-columns:1fr 1fr}}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{margin-top:4px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.sec-head a,.link-btn{font-size:13.5px;font-weight:650;color:var(--blue);text-decoration:none;background:none;border:0;cursor:pointer;padding:4px 0}
.link-btn:hover,.sec-head a:hover{text-decoration:underline}
.divider{height:1px;background:var(--line);margin:4px 0}

/* =========================================================
   4. COMPONENTS
   ========================================================= */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.pad-lg{padding:22px}
.card.tap{cursor:pointer;transition:transform .12s ease,border-color .12s}
.card.tap:hover{border-color:#c9d6e5}
.card.tap:active{transform:scale(.99)}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title h3{flex:1}

/* stat tiles */
.stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .val{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.stat .sub{font-size:12.5px;color:var(--muted)}
.stat .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.t-navy{background:var(--soft);color:var(--navy)}.t-blue{background:var(--blue-soft);color:#2a84bb}.t-teal{background:var(--teal-soft);color:#21907f}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:#b8761a}.t-bad{background:var(--bad-soft);color:var(--bad)}

/* hero summary for student */
.hero{background:var(--navy);color:#fff;border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(53,182,163,.18)}
.hero h1{color:#fff;font-size:22px}
.hero .lbl{color:#a9c3de;font-size:12.5px;font-weight:600}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .hrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;position:relative;z-index:1}
.hero .hbox{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;border:0;color:#fff;text-align:left;cursor:pointer;font:inherit}
.hero .hbox:hover{background:rgba(255,255,255,.13)}
.hero .hbox .v{font-weight:750;font-size:16px;font-variant-numeric:tabular-nums}
@media (min-width:768px){.hero .hrow{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,box-shadow .12s,transform .08s;user-select:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal);color:#fff}
.btn.teal:hover{background:#2ea392}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--navy)}
.btn.ghost:hover{background:var(--soft)}
.btn.soft{background:var(--soft);color:var(--navy)}
.btn.soft:hover{background:#e2eaf4}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger-ghost{background:#fff;border-color:#f0c9c8;color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;gap:5px}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.4;white-space:nowrap;background:var(--soft);color:var(--navy)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:#a86a12}
.badge.bad{background:var(--bad-soft);color:#b8403c}
.badge.info{background:var(--blue-soft);color:#2a7fb3}
.badge.teal{background:var(--teal-soft);color:#1f8a79}
.badge.navy{background:var(--navy);color:#fff}
.badge.line{background:#fff;border:1px solid var(--line);color:var(--muted)}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#1f8a79;background:var(--teal-soft);padding:3px 8px 3px 5px;border-radius:999px}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none;background:var(--blue)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:650;color:var(--text)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad);font-weight:600}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .12s,box-shadow .12s;font-size:15px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(78,165,217,.15)}
.input.invalid{border-color:var(--bad)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:48px}
.input-wrap .icon-btn{position:absolute;right:2px;top:2px}
.input-icon{position:relative}
.input-icon .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-icon .input{padding-left:42px}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.form-grid.two{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--navy);flex:none}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;user-select:none;min-height:38px;color:var(--text)}
.chip input{display:none}
.chip.on,.chip:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(23,59,99,.12)}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:14px;background:#cfd8e3;transition:.15s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--teal)}
.switch input:checked+span::after{transform:translateX(18px)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--muted)}
.li.tap{cursor:pointer}
.li.tap:hover .t{color:var(--navy)}
.li .amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.li-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

/* tables -> cards on phones */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;font-weight:650;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fbfcfe}
.tbl .r{text-align:right}
@media (max-width:767px){
  .tbl-wrap{border:0;background:none;box-shadow:none;overflow:visible}
  table.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px;padding:8px 14px;box-shadow:var(--shadow)}
  .tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-2);text-align:right;min-height:38px}
  .tbl td::before{content:attr(data-label);font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;flex:none}
  .tbl td.head{font-weight:750;font-size:15px;justify-content:flex-start;text-align:left}
  .tbl td.head::before{display:none}
  .tbl td.acts{justify-content:flex-end;border-bottom:0}
  .tbl td.acts::before{display:none}
  .tbl tr:hover td{background:none}
  .tbl .r{text-align:right}
}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--teal)}

/* empty / loading */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
.empty .ei{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--soft);color:var(--navy);margin-bottom:4px}
.empty h4{color:var(--text)}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--teal);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef2f7 25%,#f6f8fb 50%,#eef2f7 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* notes / disclaimers */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45;background:var(--soft);color:var(--navy)}
.note .ic{margin-top:1px}
.note.warn{background:var(--warn-soft);color:#7d500e}
.note.bad{background:var(--bad-soft);color:#9b3330}
.note.ok{background:var(--ok-soft);color:#1d6e4b}
.note.teal{background:var(--teal-soft);color:#17695c}
@media(max-width:420px){.hide-sm{display:none}}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#7d500e;background:var(--warn-soft);border-radius:6px;padding:2px 7px}

/* progress */
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--teal)}

/* =========================================================
   5. MODALS / SHEETS / TOASTS
   ========================================================= */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(12,35,64,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;width:100%;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:sheet .22s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px 20px;border-bottom:1px solid var(--line-2)}
.modal-head h2{flex:1;font-size:18px}
.modal-head::before{content:"";position:absolute;left:50%;transform:translateX(-50%);margin-top:-24px;width:40px;height:4px;border-radius:2px;background:#d6dee8}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-foot .btn{flex:1 1 auto}
@media (min-width:768px){
  .modal-back{align-items:center;padding:24px}
  .modal{max-width:560px;border-radius:20px;max-height:88vh;animation:pop .18s ease-out}
  .modal.lg{max-width:860px}
  .modal.xl{max-width:1040px}
  .modal-head::before{display:none}
  .modal-foot .btn{flex:0 0 auto}
  @keyframes pop{from{transform:scale(.97);opacity:0}}
}
.toasts{position:fixed;z-index:100;left:16px;right:16px;bottom:calc(var(--nav-h) + 14px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (min-width:768px){.toasts{left:auto;right:24px;bottom:24px;align-items:flex-end}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--navy-3);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);max-width:440px;animation:toast .25s ease-out}
.toast.ok .ic{color:#6fe0b2}.toast.bad .ic{color:#ff9c99}.toast.warn .ic{color:#ffd28a}
@keyframes toast{from{transform:translateY(12px);opacity:0}}

/* =========================================================
   6. AUTH SCREENS
   ========================================================= */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr;background:var(--bg)}
.auth-art{background:var(--navy);color:#fff;padding:calc(28px + var(--safe-t)) 22px 64px;position:relative;overflow:hidden}
.auth-art .brand{display:flex;align-items:center;gap:12px}
.auth-art .word{font-size:24px;font-weight:800;letter-spacing:-.02em}
.auth-art h1{color:#fff;font-size:28px;margin-top:26px;max-width:460px;letter-spacing:-.02em}
.auth-art p{color:#b9cfe5;margin-top:10px;max-width:440px}
.auth-art .pillars{display:none}
.auth-panel{padding:0 16px 32px;margin-top:-40px;position:relative;z-index:2}
.auth-card{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:var(--shadow-lg);max-width:460px;margin:0 auto}
.demo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left;font-weight:700;font-size:13.5px;color:var(--text);min-height:76px}
.demo-btn:hover{border-color:var(--blue);background:var(--blue-soft)}
.demo-btn small{font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.3}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:6px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (min-width:900px){
  .auth{grid-template-columns:1.05fr 1fr}
  .auth-art{padding:48px 56px;display:flex;flex-direction:column}
  .auth-art h1{font-size:40px;margin-top:auto}
  .auth-art .pillars{display:grid;gap:14px;margin-top:36px;max-width:480px}
  .auth-skyline{display:none}
  .auth-panel{margin:0;display:grid;place-items:center;padding:40px}
  .auth-card{width:100%;padding:32px}
}
.pillar{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.06);border-radius:16px;padding:14px 16px}
.pillar .pi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(53,182,163,.2);color:#7fe0d1;flex:none}
.pillar b{display:block;color:#fff}
.pillar span{color:#b9cfe5;font-size:13.5px}
.auth-skyline{position:absolute;left:0;right:0;bottom:0;opacity:.35;pointer-events:none}

/* =========================================================
   7. PROPERTY DISCOVERY
   ========================================================= */
.search-bar{display:flex;gap:8px}
.search-bar .input-icon{flex:1}
.filters{display:none;margin-top:12px}
.filters.open{display:block}
.filter-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:768px){.filter-grid{grid-template-columns:repeat(3,1fr)}}
.prop-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.prop-card .art{position:relative;aspect-ratio:16/8.5;background:var(--soft);cursor:pointer}
.prop-card .art>svg,.prop-card .art>img{display:block;width:100%;height:100%;object-fit:cover}
.prop-card .fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;cursor:pointer;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.prop-card .fav.on{color:var(--bad)}
.prop-card .fav.on svg{fill:var(--bad)}
.prop-card .flag{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.prop-card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.prop-card .price{font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.prop-card .price small{font-size:12.5px;font-weight:600;color:var(--muted)}
.amen-line{display:flex;flex-wrap:wrap;gap:6px}
.amen{font-size:12px;font-weight:600;background:var(--soft);color:var(--navy);padding:3px 9px;border-radius:7px}
.facts{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.facts span{display:inline-flex;align-items:center;gap:4px}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--text)}
.stars .ic{color:var(--warn);fill:var(--warn)}
.detail-hero{border-radius:var(--r-xl);overflow:hidden;aspect-ratio:16/7;background:var(--soft);position:relative}
.detail-hero>svg,.detail-hero>img{display:block;width:100%;height:100%;object-fit:cover}
@media (max-width:767px){.detail-hero{aspect-ratio:16/9;margin:-16px -16px 0;border-radius:0}}
.sticky-cta{position:sticky;bottom:calc(var(--nav-h) + 10px + var(--safe-b));z-index:20}
@media (min-width:768px){.sticky-cta{bottom:16px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;text-align:right}
.rule-list{display:grid;gap:10px}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule .li-ico{width:34px;height:34px;border-radius:10px}
.room-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.room-row .no{width:52px;height:52px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--navy);flex:none;font-size:13.5px;text-align:center;line-height:1.1}
.risk{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px}
.risk.low{background:var(--ok-soft)}.risk.moderate{background:var(--warn-soft)}.risk.high{background:var(--bad-soft)}.risk.none{background:var(--soft)}
.risk-scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.risk-scale i{height:6px;border-radius:3px;background:#dde4ec}
.compare-table td,.compare-table th{min-width:150px}

/* =========================================================
   8. BILLS, METER, LEDGER (signature)
   ========================================================= */
.meter{display:inline-flex;gap:3px;padding:6px;border-radius:10px;background:var(--navy-3)}
.meter b{display:grid;place-items:center;width:24px;height:32px;border-radius:5px;background:linear-gradient(#1d4673,#163a61 50%,#12345a 50%,#1b416c);color:#fff;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.meter b.dec{background:linear-gradient(#d9534f,#c7443f 50%,#b93c37 50%,#d24d48)}
.meter-pair{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.meter-pair{grid-template-columns:1fr auto 1fr;align-items:center}}
.meter-box{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ledger{border:1px dashed #c8d4e2;border-radius:14px;padding:4px 14px;background:#fcfdfe}
.ledger .ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #e1e8f0;font-size:14px}
.ledger .ln:last-child{border-bottom:0}
.ledger .ln span:first-child{color:var(--muted)}
.ledger .ln b{font-variant-numeric:tabular-nums;text-align:right}
.ledger .ln.total{font-size:16px}
.ledger .ln.total span:first-child{color:var(--text);font-weight:750}
.ledger .ln.total b{color:var(--navy);font-size:19px}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--navy-3);color:#cfe3f6;border-radius:12px;padding:12px 14px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.formula em{color:#7fe0d1;font-style:normal}
.alloc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.alloc-row:last-child{border-bottom:0}
.alloc-row .who{font-weight:650}
.alloc-row .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.alloc-row .how{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.ocr-shot{position:relative;border-radius:14px;overflow:hidden;background:var(--navy-3);aspect-ratio:16/9;display:grid;place-items:center}
.ocr-shot>img,.ocr-shot>svg{width:100%;height:100%;object-fit:cover;display:block}
.ocr-scan{position:absolute;inset:0;background:linear-gradient(transparent 0,rgba(53,182,163,.45) 50%,transparent 52%);background-size:100% 220%;animation:scan 1.1s linear infinite}
@keyframes scan{from{background-position:0 -100%}to{background-position:0 100%}}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;border:2px dashed #c8d4e2;border-radius:14px;color:var(--muted);cursor:pointer;text-align:center;font-size:13.5px;background:#fbfcfe}
.upload:hover{border-color:var(--blue);color:var(--navy)}
.upload input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:88px;height:66px;border-radius:10px;overflow:hidden;background:var(--soft);position:relative;flex:none}
.thumb>img,.thumb>svg{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.photo-lg{border-radius:12px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}
.photo-lg>img,.photo-lg>svg{width:100%;height:100%;object-fit:cover;display:block}
.compare-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:768px){.compare-grid{grid-template-columns:1fr 1fr}}
.history{border-left:2px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.history .h{position:relative;font-size:13px}
.history .h::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue)}

/* =========================================================
   9. RENTAL PASSPORT (signature)
   ========================================================= */
.passport{position:relative;border-radius:22px;overflow:hidden;background:var(--navy);color:#fff;padding:22px;box-shadow:var(--shadow-lg)}
.passport::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.13);border-radius:16px;pointer-events:none}
.passport .pp-top{display:flex;align-items:center;gap:12px;position:relative}
.passport .pp-word{font-weight:800;font-size:15px;letter-spacing:.01em}
.passport .pp-sub{font-size:12px;color:#a9c3de}
.passport .pp-name{font-size:24px;font-weight:800;margin-top:18px;letter-spacing:-.01em;position:relative}
.passport .pp-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#9fe6da;margin-top:2px;position:relative}
.passport .pp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px;position:relative}
.passport .pp-grid div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.passport .pp-grid small{display:block;font-size:11.5px;color:#a9c3de;font-weight:600}
.passport .pp-grid b{font-size:18px;font-variant-numeric:tabular-nums}
@media(min-width:768px){.passport .pp-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.passport .pp-mrz{margin-top:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.4);word-break:break-all;position:relative}
.passport .pp-seal{position:absolute;right:18px;top:18px;width:84px;height:84px;border-radius:50%;border:2px dashed rgba(53,182,163,.7);display:grid;place-items:center;text-align:center;font-size:10px;font-weight:800;color:#7fe0d1;transform:rotate(-12deg);line-height:1.2}
.stamps{display:flex;flex-wrap:wrap;gap:8px}
.stamp{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;line-height:1.05;text-align:center;border:2px solid currentColor;transform:rotate(-8deg)}
.stamp.on{color:var(--teal);background:var(--teal-soft)}
.stamp.late{color:var(--warn);background:var(--warn-soft)}
.stamp.miss{color:#c4cfdb;background:#fff;border-style:dashed}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:20px 1fr;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .rail i{width:14px;height:14px;border-radius:50%;background:var(--teal);border:3px solid var(--teal-soft);flex:none;margin-top:4px}
.tl .rail span{flex:1;width:2px;background:var(--line);margin:4px 0}
.tl:last-child .rail span{display:none}
.tl .body{padding-bottom:18px}

/* =========================================================
   10. CHARTS
   ========================================================= */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:132px;height:132px;flex:none}
.vac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.vac{border-radius:12px;padding:10px;font-size:12px;border:1.5px solid transparent;cursor:pointer;min-height:76px;display:flex;flex-direction:column;gap:2px;background:#fff;text-align:left}
.vac b{font-size:15px}
.vac.available{background:var(--ok-soft);border-color:#bfe3cf;color:#1d6e4b}
.vac.occupied{background:var(--soft);border-color:#d3deea;color:var(--navy)}
.vac.reserved{background:var(--blue-soft);border-color:#c3e1f3;color:#236f9e}
.vac.maintenance{background:var(--warn-soft);border-color:#f1dbb4;color:#8a5a12}

/* =========================================================
   11. RECEIPT / DOCUMENTS / PRINT
   ========================================================= */
.receipt{background:#fff;border-radius:18px;border:1px solid var(--line);overflow:hidden;max-width:460px;margin:0 auto}
.receipt .rc-top{background:var(--navy);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
.receipt .rc-top b{font-size:16px;letter-spacing:.02em}
.receipt .rc-top small{display:block;color:#a9c3de;font-size:12px}
.receipt .rc-amt{text-align:center;padding:20px 16px 8px}
.receipt .rc-amt .v{font-size:32px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.receipt .rc-body{padding:4px 20px 16px}
.receipt .rc-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.receipt .rc-row span{color:var(--muted)}
.receipt .rc-row b{text-align:right}
.receipt .rc-foot{background:var(--warn-soft);color:#7d500e;font-size:12px;padding:12px 20px;text-align:center}
.receipt .perf{height:14px;background:radial-gradient(circle at 7px 0,var(--bg) 6px,transparent 6.5px) 0 0/14px 14px repeat-x}
.doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;font-size:14px;line-height:1.65}
.doc h2{text-align:center;margin-bottom:4px}
.doc .stampline{text-align:center;color:var(--bad);font-weight:800;font-size:12.5px;border:2px solid var(--bad);border-radius:8px;padding:6px;margin:10px 0 16px}
.doc ol{padding-left:20px}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.doc .sig div{border-top:1.5px solid var(--text);padding-top:6px;font-size:12.5px;text-align:center}
#print-area{display:none}
@media print{
  body *{visibility:hidden!important}
  #print-area,#print-area *{visibility:visible!important}
  #print-area{display:block!important;position:absolute;left:0;top:0;width:100%;padding:20px}
  .receipt,.doc{border:1px solid #999;box-shadow:none}
}

/* misc */
.map{border-radius:14px;overflow:hidden;background:#eaf0f6;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.kpi-inline{display:flex;gap:18px;flex-wrap:wrap}
.kpi-inline div{min-width:90px}
.kpi-inline small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi-inline b{font-size:17px;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--text);cursor:pointer;min-height:78px;justify-content:center;text-align:center;line-height:1.2}
.qa button:hover{border-color:var(--blue)}
.qa .qi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--navy);background:var(--soft);border-radius:14px;padding:16px;text-align:center}
.thread{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13.5px;background:var(--soft)}
.bubble.mine{align-self:flex-end;background:var(--blue-soft)}
.bubble small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px;font-weight:600}
.processing{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 8px;text-align:center}
.success-mark{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
.fail-mark{width:72px;height:72px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.notif{display:flex;gap:12px;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer}
.notif.unread{border-color:#bcdcf0;background:#f6fbfe}
.notif .grow{flex:1;min-width:0}
.notif .t{font-weight:700;font-size:14px}
.notif .b{font-size:13px;color:var(--muted);margin-top:2px}
.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.more-grid a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;background:var(--bg);text-decoration:none;color:var(--text);font-size:12.5px;font-weight:650;text-align:center;line-height:1.2}
.more-grid a .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--navy)}
.more-grid a.on{background:var(--blue-soft)}

/* =========================================================
   12. V5 FEATURES — waste, proximity, food, hub, tasks
   ========================================================= */
.cat{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 7px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.cat.bio{background:#E3F4E9;color:#1d6e4b}.cat.rec{background:#E3F1FA;color:#1f6d9b}.cat.res{background:#ECEFF3;color:#3f4c5c}.cat.spe{background:#FBEEDC;color:#8a5a12}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 6px;min-height:118px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:#f5fcfb}
.day .dn{font-size:11.5px;color:var(--muted);font-weight:700}
.day .dd{font-size:17px;font-weight:800;line-height:1.1}
.day .evs{display:flex;flex-direction:column;gap:4px}
.pill-ev{font:inherit;font-size:11px;font-weight:750;border-radius:8px;padding:5px 6px;line-height:1.25;cursor:pointer;border:0;text-align:left;width:100%}
.pill-ev .ic{vertical-align:-2px}
@media (max-width:767px){
  .week{grid-template-columns:minmax(0,1fr);gap:6px}
  .day{min-height:0;flex-direction:row;align-items:flex-start;gap:12px;padding:10px 12px}
  .day>div:first-child{width:46px;flex:none}
  .day .evs{flex:1;flex-direction:row;flex-wrap:wrap}
  .pill-ev{width:auto;min-width:96px;min-height:44px}
}
.countdown{font-variant-numeric:tabular-nums;font-weight:800}
.sim-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.02em;color:#17695c;background:var(--teal-soft);border:1px solid #bfe7e0;border-radius:6px;padding:2px 7px;white-space:nowrap}
.share-on{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#1d6e4b;background:var(--ok-soft);border-radius:999px;padding:3px 10px}
.share-on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.prox-dist{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1}
.prox-map{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#eaf0f6}
.prox-map svg{display:block;width:100%;height:auto}
.prox-tenant{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:768px){.hub{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.hub{grid-template-columns:repeat(6,minmax(0,1fr))}}
.hub-item{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;min-height:92px;min-width:0;box-shadow:var(--shadow)}
.hub-item:hover{border-color:#c9d6e5}
.hub-item .k{font-size:12px;color:var(--muted);font-weight:650;display:flex;gap:6px;align-items:center}
.hub-item .v{font-weight:800;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hub-item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task{font:inherit;color:inherit;width:100%;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;min-height:56px}
.task:hover{border-color:#c9d6e5;background:#fbfcfe}
.prio{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:capitalize;flex:none}
.prio.urgent{background:var(--bad-soft);color:#a8342f}.prio.important{background:var(--warn-soft);color:#8a5a12}.prio.general{background:var(--soft);color:var(--navy)}
.provider{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;flex-wrap:wrap}
.logo-txt{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;flex:none;letter-spacing:.02em}
.ann-cat{font-size:11px;font-weight:700;color:var(--muted)}
.modal :focus-visible{outline-offset:1px}

/** Split a peso total across weights using the largest-remainder method so the parts always add up exactly. */
function distribute(total, weights) {
  const cents = Math.round(total * 100);
  if (!weights.length) return [];
  let w = weights.map(x => Math.max(0, Number(x) || 0));
  let sw = sum(w);
  if (sw <= 0) { w = w.map(() => 1); sw = w.length; }
  const raw = w.map(x => cents * x / sw);
  const fl = raw.map(Math.floor);
  let rem = cents - sum(fl);
  const order = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < order.length && rem > 0; k++, rem--) fl[order[k][1]]++;
  return fl.map(c => c / 100);
}

/**

 * Method "shared": one meter for the house. A configurable shared portion is split by occupied days;

    } else landlordAbsorbs += commonAmt;
    allocs.forEach(a => { a.amount = round2(a.base + a.common); });
    formula = `Room charge = (<em>current</em> − <em>previous</em> room reading) × <em>${peso(rate)}/kWh</em>\nShared by room occupants in proportion to days occupied.\nCommon area = main meter ${totalKwh} kWh − submeters ${round2(subTotal)} kWh = ${commonKwh} kWh → ${inp.commonMode === 'split' ? 'split by occupied days' : 'paid by landlord'}.`;
  } else {
    const W = inp.weights || {};
    const sharedPct = Math.min(100, Math.max(0, Number(inp.sharedPct) || 0));
    const sharedAmt = round2(billTotal * sharedPct / 100), varAmt = round2(billTotal - sharedAmt);
    allocs.forEach(a => { a.weight = round2((a.days / periodDays) * (1 + applianceWeight(a.appliances, W))); });
    const sp = distribute(sharedAmt, allocs.map(a => a.days));
    const vp = distribute(varAmt, allocs.map(a => a.weight));
    allocs.forEach((a, i) => { a.shared = sp[i]; a.variable = vp[i]; a.amount = round2(sp[i] + vp[i]); a.kwh = round2(totalKwh * (a.amount / (billTotal || 1))); });
    formula = `Bill = (${inp.currReading} − ${inp.prevReading}) kWh × ${peso(rate)} = <em>${peso(billTotal)}</em>\nShared portion ${sharedPct}% = ${peso(sharedAmt)}, split by days occupied.\nRemaining ${peso(varAmt)} split by weight = (days ÷ ${periodDays}) × (1 + appliance weights).\nThis allocates a shared meter. It does not measure each tenant's actual use.`;
  }
  return { totalKwh, billTotal, commonKwh, landlordAbsorbs: round2(landlordAbsorbs), allocations: allocs, allocatedTotal: round2(sum(allocs, a => a.amount)), formula };
}

/** Water calculation: submeter, equal, occupant-days or custom amounts. */
function calcWater(inp) {
  const occ = inp.occupants, total = round2(Number(inp.totalAmount) || 0), rate = Number(inp.rate) || 0;
  const allocs = occ.map(o => ({ tenancyId: o.tenancyId, name: o.name, roomNo: o.roomNo, roomId: o.roomId, days: o.days, m3: 0, amount: 0 }));
  let formula = '', billTotal = total, error = '';
  if (inp.method === 'submeter') {
    billTotal = 0;
    (inp.roomReadings || []).forEach(rr => {
      const m = Math.max(0, round2((Number(rr.curr) || 0) - (Number(rr.prev) || 0)));
      const inRoom = allocs.filter(a => a.roomId === rr.roomId);
      const amt = round2(m * rate); billTotal += amt;
      if (!inRoom.length) return;
      distribute(amt, inRoom.map(a => a.days)).forEach((v, i) => { inRoom[i].amount = v; inRoom[i].m3 = round2(m * inRoom[i].days / sum(inRoom, x => x.days)); });
    });
    billTotal = round2(billTotal);
    formula = `Room charge = (<em>current</em> − <em>previous</em>) m³ × <em>${peso(rate)}/m³</em>, shared by room occupants by days occupied.`;
  } else if (inp.method === 'equal') {
    distribute(total, allocs.map(() => 1)).forEach((v, i) => { allocs[i].amount = v; });
    formula = `Each tenant pays <em>${peso(total)}</em> ÷ ${allocs.length || 1} tenants.`;
  } else if (inp.method === 'occupant') {
    distribute(total, allocs.map(a => a.days)).forEach((v, i) => { allocs[i].amount = v; });
    formula = `Share = <em>${peso(total)}</em> × (tenant days ÷ total occupied days ${sum(allocs, a => a.days)}).`;
  } else {
    const ca = inp.customAmounts || {};
    allocs.forEach(a => { a.amount = round2(Number(ca[a.tenancyId]) || 0); });
    const s = round2(sum(allocs, a => a.amount));
    if (Math.abs(s - total) > 0.004) error = `Custom amounts add up to ${peso(s)}, but the bill is ${peso(total)}.`;
    formula = `Custom amounts entered by the landlord. They must add up to <em>${peso(total)}</em>.`;
  }
  return { billTotal, allocations: allocs, allocatedTotal: round2(sum(allocs, a => a.amount)), formula, error };
}

function addCharge(c) {
  const rec = Object.assign({ id: nextId('C'), paid: 0, cancelled: false, billId: null, createdAt: demoNow() }, c);
  rec.amount = round2(rec.amount); db.charges.push(rec); return rec;
}

/** Create a finalized utility bill, its tenant charges and notifications. */
function createUtilityBill(type, inp, byUserId) {
  const occ = inp.occupants || periodOccupants(inp.propertyId, inp.period);
  const calc = type === 'electricity' ? calcElectric({ ...inp, occupants: occ }) : calcWater({ ...inp, occupants: occ });
  if (calc.error) throw new Error(calc.error);
  if (!occ.length) throw new Error('No tenants occupied this property during ' + fmtPeriod(inp.period) + '.');
  const col = type === 'electricity' ? 'electricityBills' : 'waterBills';
  if (db[col].some(b => b.propertyId === inp.propertyId && b.period === inp.period && !b.voided)) throw new Error(`A ${type} bill for ${fmtPeriod(inp.period)} already exists for this property.`);
  const bill = {
    id: nextId(type === 'electricity' ? 'EB' : 'WB'), type, propertyId: inp.propertyId, period: inp.period, method: inp.method,
    meterId: inp.meterId || '', prevReading: Number(inp.prevReading) || 0, currReading: Number(inp.currReading) || 0, rate: Number(inp.rate) || 0,
    commonMode: inp.commonMode || 'landlord', sharedPct: Number(inp.sharedPct) || 0, roomReadings: inp.roomReadings || [], customAmounts: inp.customAmounts || {},
    weights: clone(inp.weights || db.settings.applianceWeights), totalAmount: type === 'electricity' ? calc.billTotal : calc.billTotal,
    allocations: calc.allocations.map(a => ({ ...a })), formula: calc.formula, landlordAbsorbs: calc.landlordAbsorbs || 0, commonKwh: calc.commonKwh || 0, totalKwh: calc.totalKwh || 0,
    photo: inp.photo || '', ocr: !!inp.ocr, notes: inp.notes || '', recordedAt: inp.recordedAt || demoNow(), dueDate: inp.dueDate || addDays(inp.period + '-' + pad(daysInPeriod(inp.period), 2), -10),
    createdBy: byUserId, status: 'Finalized', history: [{ at: inp.recordedAt || demoNow(), by: byUserId, text: 'Bill finalized and charges sent to tenants.' }],
  };
  bill.allocations.forEach(a => {
    if (a.amount <= 0) return;
    const ch = addCharge({ tenancyId: a.tenancyId, type, period: bill.period, amount: a.amount, dueDate: bill.dueDate, billId: bill.id, createdAt: bill.recordedAt });
    a.chargeId = ch.id;
    const t = get('tenants', a.tenancyId);
    if (t && t.userId) notify(t.userId, `New ${type} bill: ${peso(a.amount)}`, `${fmtPeriod(bill.period)} · ${propOf(t).name}. Due ${fmtDate(bill.dueDate)}.`, '#/bills', type === 'electricity' ? 'bolt' : 'drop', bill.recordedAt);
  });
  db[col].push(bill);
  if (!SEED_MODE) save();
  return bill;
}

/** Edit a finalized bill. The previous calculation is kept in the visible change history. */
function editUtilityBill(bill, patch, byUserId) {
  const occ = bill.allocations.map(a => ({ tenancyId: a.tenancyId, name: a.name, roomNo: a.roomNo, roomId: a.roomId, days: a.days, appliances: a.appliances || [] }));
  const next = { ...bill, ...patch };
  const calc = bill.type === 'electricity' ? calcElectric({ ...next, occupants: occ }) : calcWater({ ...next, occupants: occ });
  if (calc.error) throw new Error(calc.error);
  for (const a of calc.allocations) {
    const old = bill.allocations.find(x => x.tenancyId === a.tenancyId);
    const ch = old && old.chargeId ? get('charges', old.chargeId) : null;
    if (ch && ch.paid > a.amount + 0.004) throw new Error(`${a.name} has already paid ${peso(ch.paid)}. The new share (${peso(a.amount)}) can't be lower than that.`);
  }
  const snapshot = { prevReading: bill.prevReading, currReading: bill.currReading, rate: bill.rate, totalAmount: bill.totalAmount, allocations: bill.allocations.map(a => ({ name: a.name, amount: a.amount })) };
  const changes = Object.keys(patch).filter(k => JSON.stringify(patch[k]) !== JSON.stringify(bill[k])).map(k => `${k}: ${JSON.stringify(bill[k])} → ${JSON.stringify(patch[k])}`);
  Object.assign(bill, patch);
  bill.totalAmount = calc.billTotal; bill.formula = calc.formula; bill.landlordAbsorbs = calc.landlordAbsorbs || 0; bill.commonKwh = calc.commonKwh || 0; bill.totalKwh = calc.totalKwh || 0;
  const links = Object.fromEntries(bill.allocations.map(x => [x.tenancyId, x.chargeId]));   // keep charge links
  bill.allocations = calc.allocations.map(a => ({ ...a, chargeId: links[a.tenancyId] }));
  bill.allocations.forEach(a => {
    const ch = a.chargeId && get('charges', a.chargeId);
    if (ch) { ch.amount = a.amount; }
    const t = get('tenants', a.tenancyId);
    if (t && t.userId) notify(t.userId, `${bill.type === 'electricity' ? 'Electricity' : 'Water'} bill updated`, `${fmtPeriod(bill.period)}: your share is now ${peso(a.amount)}. See the change history on the bill.`, '#/bills', 'bolt');
  });
  bill.history.push({ at: demoNow(), by: byUserId, text: 'Edited: ' + (changes.join('; ') || 'no field changes'), snapshot });
  save();
  return bill;
}

/* ---------- payments ---------- */
let paymentLock = false;
function nextRef() { db.seq.REF = (db.seq.REF || 10000) + 1; return 'DEMO-2026-' + db.seq.REF; }
/**
 * Process a simulated payment for one or more charges.
 * outcome: 'success' | 'failed' | 'cancelled'. Charges already fully paid are skipped (duplicate protection).
 */
function processPayment({ chargeIds, amounts = {}, payerId, method, outcome = 'success', date }) {
  const when = date || demoNow();
  const batch = nextRef();
  const txs = [];
  for (const cid of chargeIds) {
    const c = get('charges', cid);
    if (!c || c.cancelled) continue;
    const bal = balance(c);
    if (bal <= 0) continue;                       // duplicate prevention
    const amt = round2(Math.min(bal, amounts[cid] != null ? Number(amounts[cid]) : bal));
    if (!(amt > 0)) continue;
    const tx = { id: nextId('TX'), ref: txs.length ? batch + '-' + (txs.length + 1) : batch, batch, chargeId: cid, payerId, amount: amt, method, status: outcome, date: when, fee: outcome === 'success' ? Number(db.settings.paymentFee) || 0 : 0 };
    if (outcome === 'success') { c.paid = round2(c.paid + amt); c.lastPaidAt = when; }
    db.transactions.push(tx); txs.push(tx);
  }
  if (!txs.length) return { txs, batch, skipped: true };
  if (!SEED_MODE) {
    const t = get('tenants', get('charges', txs[0].chargeId).tenancyId);
    const total = sum(txs, x => x.amount), p = propOf(t), payer = get('users', payerId);
    const ll = p && p.landlordId;
    if (outcome === 'success') {
      notify(ll, `Payment received: ${peso(total)}`, `${tenantName(t)} · ${p.name} room ${(roomOf(t) || {}).number}. Ref ${batch}. Demo transaction.`, '#/rent', 'pay');
      if (t.userId && t.userId !== payerId) notify(t.userId, `${payer ? payer.name : 'Someone'} paid ${peso(total)} for you`, `Ref ${batch}. Demo transaction, no real money moved.`, '#/bills', 'pay');
      if (t.userId) notify(t.userId === payerId ? payerId : null, `Payment successful: ${peso(total)}`, `Ref ${batch}. Your receipt is ready. Demo transaction.`, '#/bills', 'pay');
      if (t.userId) db.parentConnections.filter(cn => cn.studentId === t.userId && cn.status === 'approved' && cn.perms.payments && cn.parentId !== payerId).forEach(cn => notify(cn.parentId, `${tenantName(t)}'s payment recorded`, `${peso(total)} · Ref ${batch}.`, '#/payments', 'pay'));
      if (payer && payer.role === 'parent' && payerId !== t.userId) notify(payerId, `Payment successful: ${peso(total)}`, `Paid for ${tenantName(t)}. Ref ${batch}.`, '#/payments', 'pay');
    } else if (outcome === 'failed') {
      notify(payerId, 'Payment failed', `The simulated ${METHODS[method]} payment of ${peso(total)} did not go through. Nothing was charged.`, '#/bills', 'alert');
    }
    save();
  }
  return { txs, batch };
}

/* ---------- tenancy lifecycle ---------- */
function createTenancy({ userId = null, name = '', email = '', roomId, moveIn, rent, deposit, appliances = [], generateCharges = true }) {
  const room = get('rooms', roomId); if (!room) throw new Error('Choose a valid room.');
  if (room.status === 'maintenance') throw new Error('Room ' + room.number + ' is under maintenance.');
  if (occupantsOf(roomId).length >= room.capacity) throw new Error('Room ' + room.number + ' is already full.');
  if (userId && activeTenancy(userId)) throw new Error(userName(userId) + ' already has an active rental.');
  const p = get('properties', room.propertyId);
  const t = { id: nextId('T'), userId, name: userId ? '' : name, email, propertyId: p.id, roomId, landlordId: p.landlordId, moveIn, moveOut: null, rent: Number(rent) || room.rent, deposit: Number(deposit) || 0, status: 'active', appliances, landlordFeedback: '', createdAt: demoNow() };
  db.tenants.push(t);
  if (t.deposit > 0) db.deposits.push({ id: nextId('D'), tenancyId: t.id, amount: t.deposit, status: 'Held', deductions: [], refundAmount: null, refundedAt: null, history: [{ at: demoNow(), text: 'Deposit of ' + peso(t.deposit) + ' recorded (demo).' }] });
  if (generateCharges) {
    const first = moveIn.slice(0, 7);
    let p0 = +moveIn.slice(8, 10) > 15 ? addMonths(first, 1) : first;
    const last = addMonths(CURRENT_PERIOD, 1);
    if (p0 < CURRENT_PERIOD) p0 = CURRENT_PERIOD;
    while (p0 <= last) { addCharge({ tenancyId: t.id, type: 'rent', period: p0, amount: t.rent, dueDate: p0 + '-01' }); p0 = addMonths(p0, 1); }
  }
  refreshRoomStatus(roomId); save();
  return t;
}
function moveOutTenancy(tid, date) {
  const t = get('tenants', tid); if (!t) return;
  t.status = 'moved-out'; t.moveOut = date;
  db.charges.filter(c => c.tenancyId === tid && c.dueDate > date && c.paid === 0).forEach(c => { c.cancelled = true; });
  refreshRoomStatus(t.roomId); save();
}

/* ---------- rental passport ---------- */
function passportOf(uid) {
  const u = get('users', uid);
  const tens = tenanciesOfUser(uid).slice().sort(by('moveIn'));
  const tids = tens.map(t => t.id);
  const rent = db.charges.filter(c => tids.includes(c.tenancyId) && c.type === 'rent' && !c.cancelled && c.dueDate <= DEMO_TODAY);
  const paid = rent.filter(c => c.paid >= c.amount - 0.004);
  const onTime = paid.filter(c => { const tx = db.transactions.filter(x => x.chargeId === c.id && x.status === 'success').sort(by('date')).pop(); return tx && tx.date.slice(0, 10) <= c.dueDate; });
  const totalPaid = sum(db.transactions.filter(x => x.status === 'success' && tids.includes((get('charges', x.chargeId) || {}).tenancyId)), x => x.amount);
  const rate = paid.length ? onTime.length / paid.length * 100 : 0;
  const dueRate = rent.length ? onTime.length / rent.length * 100 : 0;
  const record = !rent.length ? 'No record yet' : dueRate >= 95 ? 'Excellent' : dueRate >= 85 ? 'Good' : dueRate >= 70 ? 'Fair' : 'Needs attention';
  const months = rent.sort(by('period')).map(c => ({ period: c.period, status: c.paid >= c.amount - 0.004 ? (onTime.includes(c) ? 'on' : 'late') : 'miss' }));
  return { user: u, id: u.passportId, tenancies: tens, rentCount: rent.length, completed: paid.length, onTime: onTime.length, rate, dueRate, record, totalPaid: round2(totalPaid), months };
}

/* ---------- landlord analytics ---------- */
function landlordStats(lid, period = CURRENT_PERIOD) {
  const props = propertiesOf(lid), pids = props.map(p => p.id);
  const rooms = db.rooms.filter(r => pids.includes(r.propertyId));
  const tens = tenantsOfLandlord(lid);
  const tids = new Set(db.tenants.filter(t => pids.includes(t.propertyId)).map(t => t.id));
  const ch = db.charges.filter(c => tids.has(c.tenancyId) && !c.cancelled);
  const rentP = ch.filter(c => c.type === 'rent' && c.period === period);
  const utilP = ch.filter(c => c.type !== 'rent' && c.period === period);
  const overdue = ch.filter(c => chargeStatus(c) === 'Overdue' || (chargeStatus(c) === 'Partially Paid' && c.dueDate < DEMO_TODAY));
  return {
    props: props.length, rooms: rooms.length,
    occupied: rooms.filter(r => occupantsOf(r.id).length > 0).length,
    available: rooms.filter(r => r.status === 'available').length,
    reserved: rooms.filter(r => r.status === 'reserved').length,
    maintenance: rooms.filter(r => r.status === 'maintenance').length,
    tenants: tens.length,
    expected: round2(sum(rentP, c => c.amount)), collected: round2(sum(rentP, c => c.paid)),
    outstanding: round2(sum(rentP, c => balance(c))),
    overdueTotal: round2(sum(overdue, c => balance(c))), overdueCount: overdue.length,

    beds: sum(rooms, r => r.capacity), bedsTaken: sum(rooms, r => occupantsOf(r.id).length),
    charges: ch,
  };
}
function monthlySeries(chargesList, type, months) {
  return months.map(m => { const cs = chargesList.filter(c => c.period === m && (type === 'all' || c.type === type)); return { m, billed: round2(sum(cs, c => c.amount)), paid: round2(sum(cs, c => c.paid)) }; });
}
function lastMonths(n, end = CURRENT_PERIOD) { const a = []; for (let i = n - 1; i >= 0; i--) a.push(addMonths(end, -i)); return a; }

/* ---------- platform analytics ---------- */
function platformRevenue(settings = db.settings) {
  const active = db.properties.filter(p => p.status === 'approved');
  const rooms = db.rooms.filter(r => active.some(p => p.id === r.propertyId)).length;
  const mrr = round2(rooms * (Number(settings.landlordFeePerRoom) || 0));
  const months = lastMonths(6);
  const ok = db.transactions.filter(t => t.status === 'success');
  const series = months.map(m => {
    const n = ok.filter(t => t.date.slice(0, 7) === m).length;
    return { m, subs: mrr, fees: round2(n * (Number(settings.paymentFee) || 0)), referral: round2((Number(settings.referralFee) || 0) * (Number(settings.referralPartners) || 0)), count: n };
  });
  const cur = series[series.length - 1];
  return { rooms, mrr, activeProps: active.length, series, cur, total: round2(cur.subs + cur.fees + cur.referral) };
}

function compressImage(file, max = 720) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Choose an image file.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read the file.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Could not open that image.'));
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.7));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- charts (inline SVG, computed from data) ---------- */
function barChart({ labels, series, height = 190, money = true, stacked = false }) {
  const W = 600, H = height, padL = 48, padB = 26, padT = 10, innerW = W - padL - 8, innerH = H - padB - padT;
  const totals = labels.map((_, i) => stacked ? sum(series, s => s.values[i]) : Math.max(...series.map(s => s.values[i])));
  const maxV = Math.max(1, ...totals);
  const step = Math.pow(10, Math.floor(Math.log10(maxV))); const top = Math.ceil(maxV / step) * step;
  const fmt = v => money ? (v >= 1000 ? '₱' + round2(v / 1000) + 'k' : '₱' + Math.round(v)) : String(Math.round(v));
  let g = '';
  for (let k = 0; k <= 4; k++) { const y = padT + innerH - innerH * k / 4; g += `<line x1="${padL}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#E2E8F0" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmt(top * k / 4)}</text>`; }
  const gw = innerW / labels.length, bw = Math.min(34, (gw - 14) / (stacked ? 1 : series.length));
  labels.forEach((lb, i) => {
    const x0 = padL + gw * i + (gw - bw * (stacked ? 1 : series.length)) / 2;
    let acc = 0;
    series.forEach((s, j) => {
      const v = s.values[i] || 0, h = innerH * v / top;
      const x = stacked ? x0 : x0 + j * bw, y = padT + innerH - h - (stacked ? innerH * acc / top : 0);
      acc += stacked ? v : 0;
      g += `<rect x="${x + 1}" y="${y}" width="${Math.max(2, bw - 2)}" height="${Math.max(0, h)}" rx="4" fill="${s.color}"><title>${esc(s.name)} · ${esc(lb)}: ${money ? peso(v) : v}</title></rect>`;
    });
    g += `<text x="${padL + gw * i + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function donutChart({ segments, center, sub }) {
  const tot = sum(segments, s => s.value), R = 52, C = 2 * Math.PI * R;
  let off = 0, arcs = '';
  segments.forEach(s => { if (!s.value) return; const len = C * s.value / (tot || 1); arcs += `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"><title>${esc(s.label)}: ${s.value}</title></circle>`; off += len; });
  return `<div class="donut-wrap"><svg viewBox="0 0 132 132" role="img" aria-label="Donut chart"><circle r="${R}" cx="66" cy="66" fill="none" stroke="#EDF2F8" stroke-width="18"/>${arcs}<text x="66" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="#263445">${esc(center)}</text><text x="66" y="84" text-anchor="middle" font-size="10" fill="#8492A6">${esc(sub || '')}</text></svg>
    <div class="stack-sm" style="flex:1;min-width:140px">${segments.map(s => `<div class="row between small"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block"></i>${esc(s.label)}</span><b class="num">${s.fmt ? s.fmt(s.value) : s.value}</b></div>`).join('')}</div></div>`;
}

/* Router. The current screen lives in ROUTE, so navigation works even where the page is not allowed

let ROUTE = null;

function currentRoute() { return ROUTE != null ? ROUTE : hashRoute(); }

  try { const target = '#/' + path; if (location.hash === target) return; if (replace) history.replaceState(null, '', target); else history.pushState(null, '', target); }

/* ---------- property discovery helpers ---------- */
function filterProps(f) {
  const q = f.q.trim().toLowerCase(); const qn = Number(q.replace(/[₱,\s]/g, ''));
  const min = f.min === '' ? null : Number(f.min), max = f.max === '' ? null : Number(f.max);
  let res = visibleProperties().map(p => ({ p, s: propSummary(p) })).filter(({ p, s }) => {
    if (q) {
      const hay = [p.name, p.location, p.campus, p.type, p.description, ...p.amenities.map(a => AMENITIES[a])].join(' ').toLowerCase();
      const priceHit = qn > 0 && s.rooms.some(r => Math.abs(r.rent - qn) <= 500);
      if (!hay.includes(q) && !priceHit) return false;
    }
    if (min != null || max != null) { if (!s.rooms.some(r => (min == null || r.rent >= min) && (max == null || r.rent <= max))) return false; }
    if (f.amen.length && !f.amen.every(a => p.amenities.includes(a))) return false;
    if (f.avail && !s.available) return false;
    if (f.curfew === 'yes' && p.rules.curfew === 'None') return false;
    if (f.curfew === 'no' && p.rules.curfew !== 'None') return false;
    if (f.visitors === 'allowed' && !p.rules.visitorsAllowed) return false;
    if (f.visitors === 'restricted' && p.rules.visitorsAllowed) return false;
    if (f.occ !== 'any' && !s.rooms.some(r => r.capacity <= Number(f.occ))) return false;
    if (f.flood !== 'any' && p.flood.risk !== f.flood) return false;
    if (f.campus !== 'any' && p.campus !== f.campus) return false;
    return true;
  });
  const S = { 'price-asc': (a, b) => a.s.min - b.s.min, 'price-desc': (a, b) => b.s.max - a.s.max, near: (a, b) => a.p.distanceKm - b.p.distanceKm, rating: (a, b) => b.s.rating.avg - a.s.rating.avg || b.s.rating.count - a.s.rating.count, avail: (a, b) => b.s.available - a.s.available };
  return res.sort(S[f.sort] || S['price-asc']);
}
function activeFilterCount(f) { return (f.min !== '' ? 1 : 0) + (f.max !== '' ? 1 : 0) + f.amen.length + (f.avail ? 1 : 0) + ['curfew', 'visitors', 'occ', 'flood', 'campus'].filter(k => f[k] !== 'any').length; }

      <div class="flag">${p.verified ? verifiedBadge() : '<span class="badge warn">Pending review</span>'}</div>

function payModal(chargeIds, payerId) {
  if (paymentLock) return toast('A payment is already processing. Please wait.', 'warn');
  const cs = chargeIds.map(id => get('charges', id)).filter(c => c && !c.cancelled && balance(c) > 0);
  if (!cs.length) return toast('This bill is already paid. Duplicate payments are blocked.', 'warn');
  const t = get('tenants', cs[0].tenancyId), p = propOf(t), r = roomOf(t), ll = get('users', p.landlordId);
  const total = round2(sum(cs, balance));
  const st = { method: 'gcash', outcome: 'success', amount: total };
  const rentAmt = round2(sum(cs.filter(c => c.type === 'rent'), balance)), addl = round2(total - rentAmt);
  const deadline = cs.map(c => c.dueDate).sort()[0];
  const outstanding = round2(sum(chargesOf(t.id).filter(c => c.dueDate <= DEMO_TODAY), balance));
  const summary = () => `<div class="stack">
    <div class="ledger">
      <div class="ln"><span>Property</span><b>${esc(p.name)}</b></div><div class="ln"><span>Room</span><b>${esc(r.number)}</b></div><div class="ln"><span>Landlord</span><b>${esc(ll.name)}</b></div>
      <div class="ln"><span>Tenant</span><b>${esc(tenantName(t))}</b></div><div class="ln"><span>Billing month</span><b>${uniq(cs.map(c => fmtPeriod(c.period))).join(', ')}</b></div>
      <div class="ln"><span>Rent amount</span><b>${peso(rentAmt)}</b></div><div class="ln"><span>Additional charges</span><b>${peso(addl)}</b></div>
      <div class="ln"><span>Outstanding balance (past due)</span><b>${peso(outstanding)}</b></div><div class="ln"><span>Payment deadline</span><b>${fmtDate(deadline)}</b></div>
      <div class="ln total"><span>Total payable</span><b>${peso(total)}</b></div>
    </div>
    ${cs.length === 1 ? `<div class="field"><label for="pay-amt">Amount to pay</label><input class="input" id="pay-amt" type="number" inputmode="decimal" min="1" max="${total}" step="0.01" value="${total}"><div class="hint">You can pay part of this bill. The rest stays as a balance.</div></div>` : ''}
    <div class="field"><span class="lbl">Payment method</span><div class="stack-sm">${Object.entries(METHODS).map(([k, l]) => `<label class="room-row" style="cursor:pointer;padding:10px 12px"><input type="radio" name="pm" value="${k}" ${k === st.method ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--navy)"><span class="li-ico t-${{ gcash: 'blue', maya: 'teal', wallet: 'navy', manual: 'warn' }[k]}" style="width:36px;height:36px">${icon({ gcash: 'phone', maya: 'card', wallet: 'wallet', manual: 'coins' }[k], 18)}</span><span class="strong small">${l}</span></label>`).join('')}</div></div>
    <details class="small"><summary class="strong" style="cursor:pointer">Demo controls</summary><div class="field" style="margin-top:8px"><label for="pay-out">Simulated result</label><select class="input" id="pay-out"><option value="success">Payment succeeds</option><option value="failed">Payment fails</option><option value="cancelled">Payer cancels</option></select><div class="hint">Use this to test failed and cancelled transactions.</div></div></details>
    ${demoNote('Simulation only. BoardEasy is not connected to GCash, Maya or any bank.')}</div>`;
  const m = openModal({ title: 'Pay now', body: summary(), actions: [{ label: 'Cancel', onClick: x => x.close() }, { label: 'Continue', cls: 'primary', onClick: x => confirmStep(x) }] });
  function readInputs(x) {
    const pm = $('input[name="pm"]:checked', x.body); st.method = pm ? pm.value : 'gcash';
    st.outcome = ($('#pay-out', x.body) || {}).value || 'success';
    if (cs.length === 1) { const a = Number($('#pay-amt', x.body).value); if (!(a > 0) || a > total + 0.004) { toast('Enter an amount between ₱1.00 and ' + peso(total) + '.', 'bad'); return false; } st.amount = round2(a); }
    return true;
  }
  function confirmStep(x) {
    if (!readInputs(x)) return;
    x.setTitle('Confirm payment');
    x.setBody(`<div class="processing"><div class="small muted">You are paying</div><div style="font-size:34px;font-weight:800;color:var(--navy)" class="num">${peso(st.amount)}</div><div class="small">${esc(METHODS[st.method])} · ${esc(p.name)}, room ${esc(r.number)}</div>${demoNote(DISCLAIM.pay)}</div>`);
    x.setActions([{ label: 'Back', onClick: y => { y.setTitle('Pay now'); y.setBody(summary()); y.setActions([{ label: 'Cancel', onClick: z => z.close() }, { label: 'Continue', cls: 'primary', onClick: z => confirmStep(z) }]); } }, { label: 'Confirm payment', cls: 'primary', onClick: y => processStep(y) }]);
  }
  function processStep(x) {
    if (paymentLock) return;
    paymentLock = true; x.locked = true;
    x.setTitle('Processing'); x.setActions([]);
    x.setBody(`<div class="processing"><div class="spinner" aria-hidden="true"></div><h3>Processing simulated ${esc(METHODS[st.method])} payment</h3><p class="small muted">Do not close this window.</p></div>`);
    setTimeout(() => {
      let res;
      try { res = processPayment({ chargeIds: cs.map(c => c.id), amounts: cs.length === 1 ? { [cs[0].id]: st.amount } : {}, payerId, method: st.method, outcome: st.outcome }); }
      finally { paymentLock = false; x.locked = false; }
      if (!res.txs.length) { x.setTitle('Nothing to pay'); x.setBody(empty('check', 'Already paid', 'This bill was paid while the window was open. No duplicate payment was made.')); x.setActions([{ label: 'Close', cls: 'primary', onClick: y => y.close() }]); return; }
      if (st.outcome === 'success') {
        x.setTitle('Payment successful');
        x.setBody(`<div class="processing"><div class="success-mark">${icon('check', 38)}</div><h2>DEMO PAYMENT SUCCESSFUL.</h2><p class="strong" style="color:var(--bad)">NO REAL MONEY WAS TRANSFERRED.</p><div class="num" style="font-size:28px;font-weight:800;color:var(--navy)">${peso(sum(res.txs, t => t.amount))}</div><div class="small muted">Reference ${esc(res.batch)} · ${fmtDateTime(res.txs[0].date)}</div></div>`);
        x.setActions([{ label: 'Done', onClick: y => y.close() }, { label: 'View receipt', cls: 'primary', icon: 'file', onClick: y => { y.close(); showReceipt(res.batch); } }]);
      } else if (st.outcome === 'failed') {
        x.setTitle('Payment failed');
        x.setBody(`<div class="processing"><div class="fail-mark">${icon('x', 36)}</div><h3>The simulated payment failed</h3><p class="small muted">Your balance did not change. Reference ${esc(res.batch)} is logged as Failed.</p></div>`);
        x.setActions([{ label: 'Close', onClick: y => y.close() }, { label: 'Try again', cls: 'primary', onClick: y => { y.close(); payModal(chargeIds, payerId); } }]);
      } else {
        x.setTitle('Payment cancelled');
        x.setBody(`<div class="processing"><div class="fail-mark" style="background:var(--soft);color:var(--muted)">${icon('x', 36)}</div><h3>Payment cancelled</h3><p class="small muted">No money moved and your balance is unchanged. Reference ${esc(res.batch)} is logged as Cancelled.</p></div>`);
        x.setActions([{ label: 'Close', cls: 'primary', onClick: y => y.close() }]);
      }
    }, 1600);
  }
  const origClose = m.close; m.close = () => { origClose(); refresh(); };
}

  setTitle('Rent');
