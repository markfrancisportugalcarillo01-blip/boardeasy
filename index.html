  const periods = uniq(s.charges.filter(c => c.type === 'rent').map(c => c.period)).sort().slice(-4);
  if (!periods.includes(UI.rentPeriod)) UI.rentPeriod = periods.includes(CURRENT_PERIOD) ? CURRENT_PERIOD : periods[periods.length - 1];
  const P = UI.rentPeriod;
  let cs = s.charges.filter(c => c.type === 'rent' && c.period === P);
  const tot = { exp: sum(cs, c => c.amount), col: sum(cs, c => c.paid) };
  const flt = UI.rentFilter;
  if (flt !== 'all') cs = cs.filter(c => chargeStatus(c) === flt);
  const next = addMonths(periods[periods.length - 1] || CURRENT_PERIOD, 1);
  const overdueAll = s.charges.filter(c => c.dueDate < DEMO_TODAY && balance(c) > 0);
  return `<div class="page-head"><div><h1>Rent tracking</h1><p class="muted">Payment status, partial payments and overdue accounts.</p></div><div class="btn-row"><button class="btn ghost" data-act="genRent" data-p="${next}">${icon('plus', 18)}Generate ${fmtPeriod(next)} rent</button></div></div>
    <div class="row wrap" style="gap:10px;margin-bottom:14px"><div class="seg">${periods.map(p => `<button class="${p === P ? 'on' : ''}" data-act="rentP" data-p="${p}">${fmtPeriod(p)}</button>`).join('')}</div></div>
    <div class="grid g4" style="margin-bottom:16px">${statTile('wallet', 'navy', 'Expected', peso0(tot.exp), fmtPeriod(P))}${statTile('check', 'ok', 'Collected', peso0(tot.col), pct(tot.col / (tot.exp || 1) * 100))}${statTile('alert', 'bad', 'Outstanding', peso0(tot.exp - tot.col))}${statTile('calendar', 'warn', 'Overdue accounts (all bills)', overdueAll.length, peso0(sum(overdueAll, balance)) + ' past due')}</div>
    <div class="seg" style="margin-bottom:14px">${['all', 'Paid', 'Partially Paid', 'Overdue', 'Pending'].map(x => `<button class="${flt === x ? 'on' : ''}" data-act="rentF" data-f="${x}">${x === 'all' ? 'All' : x}</button>`).join('')}</div>
    ${cs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tenant</th><th>Property · room</th><th class="r">Rent</th><th class="r">Paid</th><th class="r">Balance</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>
    ${cs.sort((a, b) => tenantName(get('tenants', a.tenancyId)).localeCompare(tenantName(get('tenants', b.tenancyId)))).map(c => { const t = get('tenants', c.tenancyId), st = chargeStatus(c); const tx = db.transactions.filter(x => x.chargeId === c.id && x.status === 'success').sort(by('date', -1))[0]; return `<tr><td class="head">${esc(tenantName(t))}</td><td data-label="Property · room">${esc(propOf(t).name)} · ${esc(roomOf(t).number)}</td><td data-label="Rent" class="r num">${peso(c.amount)}</td><td data-label="Paid" class="r num">${peso(c.paid)}</td><td data-label="Balance" class="r num">${peso(balance(c))}</td><td data-label="Due">${fmtDate(c.dueDate)}</td><td data-label="Status">${badge(st)}</td>
      <td class="acts"><div class="btn-row" style="justify-content:flex-end">${balance(c) > 0 ? `<button class="btn xs primary" data-act="manualPay" data-id="${c.id}">Record payment</button><button class="btn xs ghost" data-act="remind" data-id="${c.id}">Remind</button>` : ''}${tx ? `<button class="btn xs ghost" data-act="receipt" data-ref="${tx.batch}">Receipt</button>` : ''}${c.paid === 0 ? `<button class="btn xs ghost" data-act="editCharge" data-id="${c.id}" aria-label="Edit charge">${icon('edit', 14)}</button>` : ''}</div></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="card">${empty('wallet', 'No rent charges match', 'Try another status or month.')}</div>`}`;
};

ACT.rentF = d => { UI.rentFilter = d.f; refresh(); };
ACT.genRent = d => {

  save(); UI.rentPeriod = d.p; refresh(); toast(n ? `${n} rent charge(s) created for ${fmtPeriod(d.p)}` : 'Rent for ' + fmtPeriod(d.p) + ' already exists', n ? 'ok' : 'warn');

function manualPay(cid) {

  const t = get('tenants', c.tenancyId);
  formModal({ title: 'Record payment', intro: `<p class="small muted">${esc(tenantName(t))} · ${esc(chargeLabel(c))} · balance ${peso(balance(c))}. Use this for cash or payments made outside the app (simulated).</p>`, fields: [

/* ---------------- I-1. v5 data ---------------- */
const ANN_CATS = ['Maintenance', 'Water interruption', 'Electricity interruption', 'Cleaning schedule', 'Waste collection change', 'Building announcement', 'General reminder'];
const PROX_DEFAULTS = { at: 25, veryNear: 150, nearby: 600, onTheWay: 1500 };
/** Fictional coordinates on a demo grid near 0°N, 0°E (open ocean). They are not real places. */
function demoCoords(i) { return { lat: round6(0.0100 + (i % 5) * 0.0046 + (i % 3) * 0.0007), lng: round6(0.0100 + Math.floor(i / 5) * 0.0061 + (i % 2) * 0.0009) }; }
function round6(n) { return Math.round(n * 1e6) / 1e6; }
function wasteSeedFor(pname) {
  // [category, freq, days, start, end, prepBy, instructions]
  const T = {
    'Maple Nest Boarding House': [['bio', 'weekdays', [1, 3, 5], '06:00', '08:00', '05:30', 'Use the green bin by the gate. Bag food scraps in paper or a covered container.'], ['rec', 'weekly', [6], '07:00', '09:00', '06:30', 'Rinse bottles and cans. Flatten boxes and stack them beside the blue bin.'], ['res', 'weekly', [4], '06:00', '08:00', '05:30', 'Tie residual bags tightly. No food waste in this bag.']],
    'Blue Haven Residence': [['bio', 'weekdays', [2, 5], '06:30', '08:00', '06:00', 'Biodegradable bin at the side entrance.'], ['rec', 'weekly', [4], '07:00', '09:00', '06:30', 'Recyclables go in the lobby cage.'], ['res', 'weekly', [1], '06:30', '08:00', '06:00', 'Residual bags at the curb, not before 5:00 AM.']],

/** Predefined demo locations, as offsets in meters (north, east) from the tenant's boarding house. */
const DEMO_POINTS = [
  { name: 'Sample point A · campus library', dN: 980, dE: 1000 },
  { name: 'Sample point B · downtown', dN: -2300, dE: 2230 },
  { name: 'Sample point C · jeepney stop', dN: -360, dE: 375 },
  { name: 'Sample point D · corner store', dN: 100, dE: -98 },

}
function proxRecord(uid) { let r = db.proximity.find(x => x.userId === uid); if (!r) { r = { id: 'PX-' + uid, userId: uid, pointIdx: 0, updatedAt: demoNow(), share: { landlord: null, parent: null } }; db.proximity.push(r); save(); } return r; }

function proximityOf(uid) {

function landlordTasks(lid) {
  const ps = propertiesOf(lid), pids = ps.map(p => p.id), s = landlordStats(lid), tasks = [];
  const overdueRent = s.charges.filter(c => c.type === 'rent' && c.dueDate < DEMO_TODAY && balance(c) > 0);
  if (overdueRent.length) tasks.push({ p: 'urgent', ic: 'alert', t: `${overdueRent.length} overdue rent payment${overdueRent.length > 1 ? 's' : ''}`, s: peso(sum(overdueRent, balance)) + ' past due · send reminders or record payments', to: 'rent' });
  const wr = db.wasteReports.filter(r => pids.includes(r.propertyId) && r.status !== 'Resolved');
  if (wr.length) tasks.push({ p: 'urgent', ic: 'trashbin', t: `${wr.length} missed-collection report${wr.length > 1 ? 's' : ''}`, s: 'Tenants say trash was not collected', to: 'waste', ui: { wasteTab: 'reports' } });
  const disp = db.disputes.filter(d => ['Open', 'Under Review'].includes(d.status) && pids.includes((get('tenants', d.tenancyId) || {}).propertyId));
  if (disp.length) tasks.push({ p: 'important', ic: 'scale', t: `${disp.length} unresolved bill question${disp.length > 1 ? 's' : ''}`, s: 'Reply and set a status', to: 'disputes' });
  const bk = db.bookings.filter(b => pids.includes(b.propertyId) && b.status === 'pending');
  if (bk.length) tasks.push({ p: 'important', ic: 'calendar', t: `${bk.length} booking request${bk.length > 1 ? 's' : ''} to review`, s: 'Approve to reserve the room', to: 'bookings' });
  const noBill = ps.filter(p => tenantsOfProperty(p.id).length && !db.electricityBills.some(b => b.propertyId === p.id && b.period === CURRENT_PERIOD));
  if (noBill.length) tasks.push({ p: 'important', ic: 'bolt', t: `${fmtPeriod(CURRENT_PERIOD)} electricity not billed`, s: noBill.map(p => p.name).join(', '), to: 'utilities' });
  const unconf = ps.flatMap(p => wasteOccurrences(p.id, addDays(DEMO_TODAY, -3), DEMO_TODAY)).filter(o => demoNow() > o.endAt && !wasteEvent(o.s.id, o.date)?.status);
  if (unconf.length) tasks.push({ p: 'important', ic: 'trashbin', t: `${unconf.length} pickup${unconf.length > 1 ? 's' : ''} to confirm`, s: 'Mark recent collections as collected, delayed or missed', to: 'waste', ui: { wasteTab: 'week' } });
  const soon = ps.flatMap(p => wasteOccurrences(p.id, DEMO_TODAY, addDays(DEMO_TODAY, 1)).filter(o => o.endAt >= demoNow()).map(o => ({ o, p })));
  if (soon.length) tasks.push({ p: 'general', ic: 'trashbin', t: `${soon.length} trash pickup${soon.length > 1 ? 's' : ''} in the next 2 days`, s: soon.slice(0, 2).map(x => `${x.p.name}: ${WASTE_CATS[x.o.s.category].short} ${relDay(x.o.date).toLowerCase()} ${fmtTime(x.o.s.start)}`).join(' · '), to: 'waste', ui: { wasteTab: 'week' } });
  const vac = db.rooms.filter(r => pids.includes(r.propertyId) && r.status === 'available' && occupantsOf(r.id).length === 0);
  if (vac.length) tasks.push({ p: 'general', ic: 'bed', t: `${vac.length} vacant room${vac.length > 1 ? 's' : ''}`, s: vac.slice(0, 3).map(roomLabel).join(', '), to: 'vacancy' });

  return tasks;

   H. SELF-CHECK (runs on a throwaway seed; never touches saved data)

function runSelfCheck() {
  const saved = db, savedLock = paymentLock;
  const out = [];
  const T = (name, fn) => { try { const r = fn(); out.push({ name, pass: !!(r && r.pass), detail: (r && r.detail) || '' }); } catch (e) { out.push({ name, pass: false, detail: 'Error: ' + e.message }); } };

    db = seed(); db.__test = true; paymentLock = false;

    const alex = U('student@example.com'), dan = U('landlord@example.com'), maria = U('parent@example.com');
    T('Seed data: 12 students, 8 landlords, 5 parents, 15 properties, 40 rooms', () => { const c = r => db.users.filter(u => u.role === r).length; const ok = c('student') === 12 && c('landlord') === 8 && c('parent') === 5 && db.properties.length === 15 && db.rooms.length === 40; return { pass: ok, detail: `${c('student')}/${c('landlord')}/${c('parent')} users · ${db.properties.length} properties · ${db.rooms.length} rooms` }; });
    T('Seed data: 25+ rent transactions, 20 utility bills, 15 reviews, 10 reports, 15+ notifications', () => { const rt = db.transactions.filter(x => get('charges', x.chargeId).type === 'rent').length; const ub = db.electricityBills.length + db.waterBills.length; return { pass: rt >= 25 && ub === 20 && db.reviews.length === 15 && db.reports.length === 10 && db.notifications.length >= 15, detail: `${rt} rent tx · ${ub} bills · ${db.reviews.length} reviews · ${db.reports.length} reports · ${db.notifications.length} notifications` }; });
    T('Referential integrity (rooms, tenants, charges, reviews, bills)', () => {
      const bad = [];
      db.rooms.forEach(r => { if (!get('properties', r.propertyId)) bad.push('room ' + r.id); });
      db.tenants.forEach(t => { const r = get('rooms', t.roomId); if (!r || r.propertyId !== t.propertyId) bad.push('tenant ' + t.id); if (get('properties', t.propertyId).landlordId !== t.landlordId) bad.push('owner ' + t.id); });
      db.charges.forEach(c => { if (!get('tenants', c.tenancyId)) bad.push('charge ' + c.id); });
      db.transactions.forEach(x => { if (!get('charges', x.chargeId)) bad.push('tx ' + x.id); });
      db.reviews.forEach(r => { const t = get('tenants', r.tenancyId); if (!t || t.propertyId !== r.propertyId || !isVerifiedTenancy(t)) bad.push('review ' + r.id); });
      db.electricityBills.concat(db.waterBills).forEach(b => b.allocations.forEach(a => { const t = get('tenants', a.tenancyId); if (!t || t.propertyId !== b.propertyId) bad.push('bill ' + b.id); }));
      db.rooms.forEach(r => { if (occupantsOf(r.id).length > r.capacity) bad.push('overfull ' + r.id); });
      return { pass: !bad.length, detail: bad.length ? bad.slice(0, 5).join(', ') : 'All links valid' };
    });
    T('Student dashboard: Maple Nest room 203, rent ₱5,500, electricity 30 kWh × ₱11.17, water MNWD 24 m³ ÷ 4, outstanding ₱0', () => {
      const t = activeTenancy(alex.id), cs = chargesOf(t.id).filter(c => c.period === '2026-11');
      const e = cs.find(c => c.type === 'electricity'), w = cs.find(c => c.type === 'water'), d = studentDues(alex.id);
      const next = chargesOf(t.id).filter(c => c.type === 'rent' && balance(c) > 0).sort(by('dueDate'))[0];
      const ok = propOf(t).name === 'Maple Nest Boarding House' && roomOf(t).number === '203' && t.rent === 5500 && e.amount === round2(30 * 11.17) && w.amount === round2(mnwdCharge(24) / 4) && sum(d.past, balance) === 0 && next.dueDate === '2026-12-01';
      return { pass: ok, detail: `${propOf(t).name} ${roomOf(t).number} · ${peso(t.rent)} · ${peso(e.amount)} · ${peso(w.amount)} · next due ${next.dueDate}` };
    });
    T('Electricity method A: 120 → 150 kWh × ₱13 = ₱390', () => { const c = calcElectric({ method: 'submeter', prevReading: 120, currReading: 150, rate: 13, period: '2026-11', commonMode: 'landlord', roomReadings: [{ roomId: 'X', prev: 120, curr: 150 }], occupants: [{ tenancyId: 'a', name: 'A', roomId: 'X', roomNo: '1', days: 30, appliances: [] }] }); return { pass: c.allocations[0].amount === 390 && c.allocations[0].kwh === 30, detail: `${c.allocations[0].kwh} kWh → ${peso(c.allocations[0].amount)}` }; });
    T('Electricity method B: shared allocation adds up exactly to the bill', () => { const occ = [{ tenancyId: 'a', name: 'A', roomId: 'R1', roomNo: '1', days: 30, appliances: ['fan', 'aircon'] }, { tenancyId: 'b', name: 'B', roomId: 'R1', roomNo: '1', days: 17, appliances: ['laptop'] }, { tenancyId: 'c', name: 'C', roomId: 'R2', roomNo: '2', days: 30, appliances: [] }]; const c = calcElectric({ method: 'shared', prevReading: 1000, currReading: 1097.37, rate: 13.07, sharedPct: 33, period: '2026-11', occupants: occ, weights: db.settings.applianceWeights }); return { pass: Math.abs(c.allocatedTotal - c.billTotal) < 0.001 && c.allocations[0].amount > c.allocations[2].amount, detail: `bill ${peso(c.billTotal)} · allocated ${peso(c.allocatedTotal)} · ${c.allocations.map(a => peso(a.amount)).join(' + ')}` }; });

    T('Failed payment does not mark the bill as paid', () => { const c = dec(mia.id); const r = processPayment({ chargeIds: [c.id], payerId: mia.id, method: 'maya', outcome: 'failed' }); return { pass: c.paid === 0 && r.txs[0].status === 'failed' && chargeStatus(c) === 'Pending', detail: `tx ${r.txs[0].status} · bill ${chargeStatus(c)}` }; });
    T('Cancelled payment stays cancelled with no balance change', () => { const c = dec(chloe.id); const r = processPayment({ chargeIds: [c.id], payerId: chloe.id, method: 'wallet', outcome: 'cancelled' }); return { pass: c.paid === 0 && r.txs[0].status === 'cancelled', detail: `tx ${r.txs[0].status} · paid ${peso(c.paid)}` }; });
    T('Partial payment sets Partially Paid', () => { const c = dec(chloe.id); processPayment({ chargeIds: [c.id], amounts: { [c.id]: 1000 }, payerId: chloe.id, method: 'gcash', outcome: 'success' }); return { pass: chargeStatus(c) === 'Partially Paid' && balance(c) === c.amount - 1000, detail: `${peso(c.paid)} paid · ${peso(balance(c))} left` }; });

    T('Rental Passport is calculated from payment history', () => { const pp = passportOf(alex.id); const paid = db.charges.filter(c => tenanciesOfUser(alex.id).some(t => t.id === c.tenancyId) && c.type === 'rent' && c.dueDate <= DEMO_TODAY && c.paid >= c.amount).length; return { pass: pp.completed === paid && pp.rate === 100 && pp.record === 'Excellent', detail: `${pp.completed} periods · ${pct(pp.rate)} · ${pp.record}` }; });
    T('Booking approval reserves the room', () => { const b = db.bookings.find(x => x.status === 'pending'); b.status = 'approved'; refreshRoomStatus(b.roomId); return { pass: get('rooms', b.roomId).status === 'reserved', detail: 'room ' + roomNum(b.roomId) + ' → ' + get('rooms', b.roomId).status }; });
    T('Editing a bill recalculates shares and keeps the change history', () => { const b = db.electricityBills.find(x => x.method === 'submeter' && x.period === '2026-11'); editUtilityBill(b, { rate: 15 }, dan.id); const a = b.allocations.find(x => x.name === 'Alex Santos'); return { pass: a.amount === 450 && b.history.length === 2 && b.history[1].snapshot.rate === 11.17 && get('charges', a.chargeId).amount === 450, detail: `Alex ${peso(a.amount)} · history ${b.history.length} entries` }; });
    T('New tenancy creates charges, deposit and updates occupancy', () => { const r = db.rooms.find(x => x.status === 'available' && occupantsOf(x.id).length === 0 && x.capacity === 1); const t = createTenancy({ name: 'Test Tenant', roomId: r.id, moveIn: DEMO_TODAY, rent: 2000, deposit: 2000 }); return { pass: get('rooms', r.id).status === 'occupied' && chargesOf(t.id).length >= 1 && db.deposits.some(x => x.tenancyId === t.id), detail: `room ${r.number} → ${get('rooms', r.id).status} · ${chargesOf(t.id).length} charge(s)` }; });
    /* ---- v5: waste scheduler ---- */
    const maple = db.properties.find(p => p.name === 'Maple Nest Boarding House');
    T('Waste: every schedule, event and report links to a valid property/schedule', () => { const bad = db.wasteSchedules.filter(s => !get('properties', s.propertyId)).length + db.wasteEvents.filter(e => !get('wasteSchedules', e.scheduleId)).length + db.wasteReports.filter(r => !get('properties', r.propertyId)).length; return { pass: bad === 0 && db.wasteSchedules.length >= 20, detail: db.wasteSchedules.length + ' schedules · ' + db.wasteEvents.length + ' events · ' + db.wasteReports.length + ' reports' }; });
    T('Waste: next Maple Nest pickup is tomorrow (Wednesday) 6:00–8:00 AM, Biodegradable', () => { const n = nextPickups(maple.id, 1)[0]; return { pass: !!n && n.date === '2026-11-25' && n.s.category === 'bio' && n.s.start === '06:00' && relDay(n.date) === 'Tomorrow', detail: n ? relDay(n.date) + ' ' + n.date + ' ' + n.s.category + ' ' + fmtTime(n.s.start) + '–' + fmtTime(n.s.end) : 'none' }; });
    T('Waste: recurrence rules (every 2 weeks, one-time, suspended)', () => {

      return { pass: ok && !occursOn(w, wd) && wasteOccurrences('nope', DEMO_TODAY, addDays(DEMO_TODAY, 7)).length === 0, detail: 'custom on 11/07 and 11/21 only · one-time on 12/05 · suspended yields none' };

    T('Waste: create, validate and edit schedules (separate per property)', () => {

      let err2 = ''; try { saveWasteSchedule({ propertyId: maple.id, category: 'rec', freq: 'weekdays', days: ['2'], start: '07:00', end: '08:00', prepBy: '06:30', leads: ['24'] }, null, maple.landlordId); } catch (e) { err2 = e.message; }
      const before = db.notifications.length;
      saveWasteSchedule(Object.assign({}, s1, { days: ['4'], start: '07:30', end: '09:00', prepBy: '07:00', leads: ['12'] }), s1, maple.landlordId);
      const told = db.notifications.slice(before).filter(n => /schedule changed/.test(n.title)).length;
      return { pass: !!err1 && !!err2 && s1.days[0] === 4 && s1.start === '07:30' && s1.history.length === 2 && told === tenantsOfProperty(maple.id).filter(t => t.userId).length && schedulesOf(blue.id).every(s => s.propertyId === blue.id), detail: 'invalid time rejected · duplicate rejected · edit notified ' + told + ' tenant(s)' };
    });
    T('Waste: reminders are created once (no duplicates)', () => { const a = syncWasteReminders(), b = syncWasteReminders(); return { pass: b === 0, detail: a + ' created, then ' + b + ' on second run (Manila time ' + manilaClock() + ')' }; });
    T('Waste: tenant prepared mark and landlord missed status', () => {
      const alexT = activeTenancy(alex.id), n = nextPickups(maple.id, 1)[0];
      togglePrepared(n.s.id, n.date, alexT.id); const st1 = occStatus(n, alexT.id);
      const before = db.notifications.length; setOccStatus(n.s.id, n.date, 'Missed', 'Truck did not arrive', maple.landlordId); const st2 = occStatus(n, alexT.id);
      const notified = db.notifications.slice(before).some(x => x.userId === alex.id && /missed/i.test(x.title) && x.priority === 'urgent');
      return { pass: st1 === 'Ready for Collection' && st2 === 'Missed' && notified, detail: st1 + ' → ' + st2 + ' · tenant notified (urgent)' };
    });
    /* ---- v5: proximity ---- */
    T('Proximity: Haversine matches known distances', () => { const d1 = haversine({ lat: 0, lng: 0 }, { lat: 0, lng: 1 }); const b = { lat: 0.02, lng: 0.02 }; const d2 = haversine(b, offsetCoord(b, 30, 40)); return { pass: Math.abs(d1 - 111195) < 5 && Math.abs(d2 - 50) < 0.5, detail: '1° of longitude at the equator = ' + Math.round(d1) + ' m · 30 m N + 40 m E = ' + d2.toFixed(2) + ' m' }; });
    T('Proximity: invalid or missing coordinates are handled', () => ({ pass: haversine(null, { lat: 0, lng: 0 }) === null && haversine({ lat: 95, lng: 0 }, { lat: 0, lng: 0 }) === null && haversine({ lat: NaN, lng: 0 }, { lat: 0, lng: 0 }) === null && proxStatus(null).label === 'Location unavailable', detail: 'null, out-of-range and NaN return no distance' }));
    T('Proximity: status thresholds (5 m, 50 m, 500 m, 2 km)', () => { const a = proxStatus(50).label, b = proxStatus(500).label, c = proxStatus(2000).label, d = proxStatus(5).label; return { pass: a === 'Very Near' && b === 'Nearby' && c === 'Far Away' && d === 'At Boarding House', detail: [d, a, b, c].join(' · ') }; });
    T('Proximity: Alex is 1.4 km away from stored coordinates; moving recalculates', () => {
      const px = proximityOf(alex.id); const calc = haversine(px.here, px.house); const first = fmtDist(px.meters);
      const r = proxRecord(alex.id); r.pointIdx = 2; const px2 = proximityOf(alex.id);
      return { pass: first === '1.4 km' && Math.abs(calc - px.meters) < 0.001 && px2.meters < px.meters && px2.status.label === 'Nearby', detail: first + ' (' + px.status.label + ') → ' + fmtDist(px2.meters) + ' (' + px2.status.label + ')' };
    });
    T('Proximity: sharing is off by default, starts, stops and expires', () => {
      const r = proxRecord(alex.id); const off = !shareActive(r, 'landlord') && !shareActive(r, 'parent');
      r.share.landlord = { since: Date.now(), until: Date.now() + 3600000 }; const html = sharedProximityHTML(alex.id, 'landlord'); const on = shareActive(r, 'landlord') && html.includes('SIMULATED GPS') && !html.includes(proximityOf(alex.id).here.lat.toFixed(5));
      r.share.landlord = null; const stopped = !shareActive(r, 'landlord') && sharedProximityHTML(alex.id, 'landlord') === '';
      r.share.parent = { since: Date.now() - 7200000, until: Date.now() - 1000 }; const n = expireShares();
      return { pass: off && on && stopped && n >= 1 && r.share.parent === null, detail: 'default off · shared view hides coordinates · stop works · expired share cleared' };
    });
    T('Proximity: the device location is never requested', () => {
      const g = navigator.geolocation; let calls = 0; const orig = g ? [g.getCurrentPosition, g.watchPosition] : null;
      try {
        if (g) { try { Object.defineProperty(g, 'getCurrentPosition', { value: () => calls++, configurable: true }); Object.defineProperty(g, 'watchPosition', { value: () => calls++, configurable: true }); } catch (e) { /* read-only in some browsers */ } }
        for (let i = 0; i < 6; i++) { const r = proxRecord(alex.id); r.pointIdx = i; proximityOf(alex.id); proximityCard(alex.id, false); }
        mounts.length = 0;
      } finally { if (g && orig) { try { Object.defineProperty(g, 'getCurrentPosition', { value: orig[0], configurable: true }); Object.defineProperty(g, 'watchPosition', { value: orig[1], configurable: true }); } catch (e) { } } }
      const src = Array.from(document.scripts).map(x => x.textContent).join(''); const used = src.includes('getCurrent' + 'Position(') || src.includes('watch' + 'Position(');
      return { pass: calls === 0 && !used, detail: calls + ' geolocation calls · no geolocation call in the source' };
    });
    /* ---- v5: food handoff ---- */
    T('Order Food: official https links only, partner API not configured, no records created', () => {
      const ok = FOOD_PROVIDERS.filter(p => p.url).every(p => /^https:\/\/(www\.grab\.com\/ph\/food\/|www\.foodpanda\.ph\/)$/.test(p.url)) && FOOD_PROVIDERS.find(p => p.id === 'partner').status === 'Partner Integration Not Configured';
      const counts = () => COLLECTIONS.map(c => db[c].length).join(',');
      const before = counts(); foodModal(); modalStack.slice().forEach(m => m.close()); const after = counts();
      return { pass: ok && before === after, detail: FOOD_PROVIDERS.filter(p => p.url).map(p => p.url).join(' · ') + ' · data unchanged' };
    });
    /* ---- v5: storage ---- */
    T('Storage: v4 data migrates to v5 and keeps changes; unusable data is rejected', () => {
      const old = clone(db); old.version = 4; ['wasteSchedules', 'wasteEvents', 'wasteReports', 'proximity'].forEach(c => delete old[c]); old.properties.forEach(p => delete p.coords);
      old.users.push({ id: 'U-9999', name: 'Kept Change', role: 'student', email: 'kept@example.com', password: 'x', active: true, favorites: [] });
      const keepDb = db; let m;
      try { m = migrateDB(old); } finally { db = keepDb; }
      const good = m.version === DB_VERSION && m.wasteSchedules.length > 0 && m.properties.every(p => validCoord(p.coords)) && m.users.some(u => u.email === 'kept@example.com') && repairDB(m);
      const broken = repairDB({ users: [], settings: null }) === false;
      return { pass: good && broken, detail: 'migrated v4 → v' + m.version + ' · custom user kept · broken data rejected' };
    });
    T('Notifications: duplicate keys are ignored and priority is set', () => { const a = notify(alex.id, 'Test reminder', 'x', '', 'waste', undefined, { key: 'k-test' }), b = notify(alex.id, 'Test reminder', 'x', '', 'waste', undefined, { key: 'k-test' }); return { pass: !!a && b === null && a.priority === 'important' && priorityOf('alert', 'x') === 'urgent', detail: 'second copy blocked · priority ' + (a && a.priority) }; });
    T('Water: MNWD residential tiers (10, 24 and 55 m³)', () => { const a = mnwdCharge(10), b = mnwdCharge(24), c = mnwdCharge(55); return { pass: a === 160 && b === 423.2 && c === 1102.25, detail: peso(a) + ' · ' + peso(b) + ' · ' + peso(c) }; });
    T('Places: every property is in a real Naga City barangay near a real campus', () => ({ pass: db.properties.every(p => LOCATIONS.includes(p.location) && CAMPUSES.includes(p.campus)), detail: uniq(db.properties.map(p => p.location)).length + ' barangays · ' + uniq(db.properties.map(p => p.campus)).length + ' campuses' }));
    T('Text from users is escaped before display', () => ({ pass: esc('<img src=x onerror=alert(1)>') === '&lt;img src=x onerror=alert(1)&gt;', detail: 'esc() converts HTML characters' }));
  } finally { db = saved; paymentLock = savedLock; }
  return out;
}

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
function boot() {
  loadDB();
  syncWasteReminders(); expireShares();
  try { session = JSON.parse(Store.get(SESSION_KEY) || 'null'); } catch (e) { session = null; }
  if (session && !get('users', session.userId)) session = null;
  const q = new URLSearchParams(location.search);
  const as = q.get('as');
  if (as && DEMO_ACCOUNTS[as]) { const u = db.users.find(x => x.email === DEMO_ACCOUNTS[as][0]); if (u) { session = { userId: u.id }; Store.set(SESSION_KEY, JSON.stringify(session)); setPref('intro_' + u.role, 1); } }
  render();
  if (q.get('selftest')) {
    const r = runSelfCheck(); const pre = document.createElement('pre'); pre.id = 'selftest';
    pre.textContent = r.map(x => (x.pass ? 'PASS' : 'FAIL') + ' | ' + x.name + ' | ' + x.detail).join('\n') + '\nSUMMARY ' + r.filter(x => x.pass).length + '/' + r.length;
    pre.style.cssText = 'white-space:pre-wrap;padding:16px;font-size:12px'; document.body.appendChild(pre);
  }
  if (!storageOK) toast('Storage is unavailable. Changes will not persist after a refresh.', 'warn', 6000);
  if (recoveredFromCorrupt) toast('Saved demo data could not be read, so the sample data was restored. A backup copy was kept in this browser.', 'warn', 7000);
  if (migratedFrom) toast('Demo data upgraded: real Naga City areas and current utility rates. Your changes were kept. Use Settings → Reset demo (administrator) to load the new sample prices.', 'ok', 7000);
  // In-app reminders only: check once a minute for due waste reminders and expired location sharing.
  setInterval(() => { if (!db || !me()) return; const n = syncWasteReminders() + expireShares(); if (n && !modalStack.length) refresh(); }, 60000);
}
window.addEventListener('error', e => { console.error(e.error || e.message); });
boot();
</script>
